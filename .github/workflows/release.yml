# Push a tag like v0.1.0 to release that version.
# The image and the release are only made if the tag matches ROOM_VERSION
# in src/room.h and ci.yml passes.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  version:
    name: Check the tag matches ROOM_VERSION
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Compare tag and src/room.h
        run: |
          want="#define ROOM_VERSION \"${GITHUB_REF_NAME#v}\""
          if ! grep -qxF "$want" src/room.h; then
            echo "::error::tag $GITHUB_REF_NAME does not match ROOM_VERSION in src/room.h"
            exit 1
          fi

  test:
    name: Test
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    name: Push the release image
    needs: [version, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # QEMU builds the arm64 image on this x86_64 runner.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          # Registry names must be lower case.
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr "[:upper:]" "[:lower:]")"
          docker build --platform linux/amd64,linux/arm64 --target release \
            --tag "$image:${GITHUB_REF_NAME#v}" --tag "$image:latest" --push .

  binaries:
    name: Create the GitHub release
    needs: [version, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - run: make dist
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes build/dist/*
